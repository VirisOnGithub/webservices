<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Journal de Bord - Messagerie</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="sidebar">
    <div id="sidebar-header">🧠 Journal de Bord</div>
    <div id="channel-list">
        <p style="padding:10px; color:#80848e;">Chargement des salons...</p>
    </div>
</div>

<div id="chat-container">
    <div id="chat-header">Sélectionnez un salon pour commencer</div>
    <div id="message-area">
        <p style="color:#80848e; text-align:center; margin-top:20px;">Aucun salon actif</p>
    </div>
    <form id="message-form">
        <input type="text" id="message-input" placeholder="Envoyer un message..." autocomplete="off" disabled>
        <button type="submit" id="send-btn" disabled>Envoyer</button>
    </form>
</div>

<script src="app.js"></script>
</body>
</html>
